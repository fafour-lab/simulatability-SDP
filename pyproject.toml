[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heloc-cgrr"
version = "0.1.0"
description = "Reproducibility code for counterexample-guided rule refinement on HELOC."
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["cgrr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

